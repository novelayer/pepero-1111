<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F8F1E6" />
    <title>현지에게 도착한 달콤한 선물</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="현지에게 도착한 달콤한 선물" />
    <meta property="og:description" content="11월 11일, 작은 서프라이즈가 기다리고 있어!" />
    <meta property="og:image" content="%SITE_URL%og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Cpath d='M0 7C-9 1-10-6-5-8C-2.5-9-.8-7.6 0-5.6C.8-7.6 2.5-9 5-8C10-6 9 1 0 7Z' fill='%23E992AB'/%3E%3C/svg%3E" />
    <style>
      html,body{margin:0;height:100%;background:#F8F1E6}
      #fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;text-align:center;color:#573B32;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;background:#F8F1E6;z-index:99}
      #fallback h1{font-size:24px;line-height:1.4;margin:0}
      #fallback p{margin:0;font-size:16px;line-height:1.6}
      #fallback .cta{font-weight:800;color:#AD7564;font-size:18px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 스크립트가 실패해도 메시지는 꼭 전달된다 -->
    <div id="fallback" role="alert">
      <h1>띵동! 문고리에 선물이 걸렸어요!</h1>
      <p>허찌가 현지를 위해 준비한 선물이야.</p>
      <p class="cta">현지야, 문 열고 바깥 문고리를 확인해 봐!</p>
      <p>현지야, 나 계속 좋아해주라 ♡</p>
    </div>
    <noscript><style>#fallback{display:flex}</style></noscript>
    <script>
      window.__showFallback = function () { var f = document.getElementById('fallback'); if (f) f.style.display = 'flex'; };
      window.addEventListener('error', function () { if (!window.__appReady) window.__showFallback(); });
      setTimeout(function () { if (!document.querySelector('#root .app')) window.__showFallback(); }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
